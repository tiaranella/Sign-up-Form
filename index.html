<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- <title>Sign-up Form</title> -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div id="logo-side">
        <!-- <img id="logo-background-image" src="man-in-rice-field.jpg" alt="logo-background"> -->
        <div id="logo">
            <img id="logo-image" src="odin-lined.png" alt="logo">
            <p id="logo-text">Odin</p>
        </div>
    </div>

    <!-- <div id="introduction">
        <p>This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams. Sign up now to get started.</p>
        <p>You know you want to.</p>
    </div> -->

    <div id="form-side">

    <div id="introduction">
        <p>This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams. Sign up now to get started.</p>
        <p>You know you want to.</p>
    </div>

        <div id="form-fields">
            <p id="form-intro">Let's do this!</p>

            <form id="form" action="">
                <div class="form-group">
                    <label for="first-name">First Name</label>
                    <input type="text" name="first-name" id="first-name" required minlength="2">
                </div>

                <div class="form-group">
                    <label for="last-name">Last Name</label>
                    <input type="text" name="last-name" id="last-name" required minlength="2">
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" name="email" id="email" required placeholder="email@mail.com">
                </div>

                <div class="form-group">
                    <label for="phone-number">Phone Number</label>
                    <input type="phone-number" name="phone-number" id="phone-number" required minlength="9" placeholder="+380 (12) 345 67 89">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" name="password" id="password" required minlength="6">
                </div>

                <div class="form-group">
                    <label for="password-confirm">Confirm Password</label>
                    <input type="password" name="password-confirm" id="password-confirm" required minlength="6">
                </div>

                <!-- <label for="submit-button">Create Account</label>
                <input type="submit" name="submit-button" id="submit-button"> -->
            </form>

            <p id="confirmPasswordError" class="error-message">Passwords do not match</p>

        </div>

        <button id="submit-button" type="submit" form="form">Create Account</button>

    <!-- <div id="sign-up-button"> -->

        <p id="log-in">Already have an account? <a href="google.com" style="color: green">Log in</a></p>
    </div>

    <script src="script.js"></script>

    <!-- <script src="script.js"></script> -->
</body>
</html>
